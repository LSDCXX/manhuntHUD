[Settings]
; L key toggles hud on and off ingame on the fly
ToggleKey=76

; > for peek hud
PeekKey=190

; recap tab button (16 = shift)
ContinueKey=16
ContinueText=按住继续

; ---- FX (post-process look) ----
; master switch: 0 = no CRT and no film grain (clearest image)
FX=1

; individual overlays (only used when FX=1)
CRT=1
FilmGrain=1

; CRT scanline strength, 0-100 (100 = original intensity, 0 = off)
CRTStrength=100

; film grain strength, 0-255 (25 = original, 0 = off)
GrainStrength=25

; pauses cutscenes (80 = P) 
EnableCutscenePause=1
CSKey=80
; %s is replaced with the CSKey name
PauseOnText=已暂停: 按 %s 继续
PauseOffText=按 %s 暂停过场

; displays the old game clock under the armor and health bars (disabled by default)
GrandfatherClock=0
